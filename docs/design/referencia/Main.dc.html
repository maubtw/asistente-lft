<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asistente LFT: inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECEEEA}
a{color:#4F5864}a:hover{color:#18202B}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #4536A6;outline-offset:2px}
.sug:hover{background:#E1E4DE;color:#18202B}
.ask:hover{background:#3A2C93}
</style>
</helmet>
<div style="min-height:900px;background:#ECEEEA;color:#18202B;font-family:'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column">

<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px">
<span style="display:flex;align-items:center;gap:10px">
<svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="none" stroke="#4536A6" stroke-width="1.5"></circle><circle cx="17" cy="17" r="12.5" fill="none" stroke="#4536A6" stroke-width="0.75"></circle><text x="17" y="22.5" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="15" fill="#4536A6">§</text></svg>
<span style="font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:500">Asistente LFT</span>
</span>
<button aria-label="Ajustes" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;color:#4F5864;cursor:pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</button>
</header>

<main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 80px">
<div style="width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:36px">

<h1 style="margin:0;text-align:center;font-family:'Source Serif 4',Georgia,serif;font-weight:500;font-size:48px;line-height:1.08;letter-spacing:-0.02em">¿Qué dice la ley sobre tu trabajo?</h1>

<form style="width:100%;display:flex;flex-direction:column;gap:16px">
<label for="pregunta" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tu pregunta sobre la Ley Federal del Trabajo</label>
<div style="background:#F7F8F5;border:1px solid #B9BFB7;border-radius:18px;padding:18px 14px 14px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 48px -32px rgba(24,32,43,.35)">
<textarea id="pregunta" rows="2" placeholder="Pregunta con tus palabras, por ejemplo: ¿cuándo me tienen que pagar el aguinaldo?" style="width:100%;border:0;background:transparent;resize:none;font-family:inherit;font-size:17px;line-height:1.5;color:#18202B;outline:none;box-sizing:border-box"></textarea>
<div style="display:flex;justify-content:flex-end">
<button type="button" class="ask" aria-label="Preguntar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:#4536A6;color:#fff;cursor:pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</button>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px">
<button type="button" class="sug" style="height:36px;padding:0 14px;border:1px solid #CDD2CB;border-radius:18px;background:transparent;font-family:inherit;font-size:14px;color:#4F5864;cursor:pointer">Días de vacaciones</button>
<button type="button" class="sug" style="height:36px;padding:0 14px;border:1px solid #CDD2CB;border-radius:18px;background:transparent;font-family:inherit;font-size:14px;color:#4F5864;cursor:pointer">Despido sin causa</button>
<button type="button" class="sug" style="height:36px;padding:0 14px;border:1px solid #CDD2CB;border-radius:18px;background:transparent;font-family:inherit;font-size:14px;color:#4F5864;cursor:pointer">Horas extra</button>
<button type="button" class="sug" style="height:36px;padding:0 14px;border:1px solid #CDD2CB;border-radius:18px;background:transparent;font-family:inherit;font-size:14px;color:#4F5864;cursor:pointer">Permiso de paternidad</button>
</div>
</form>

</div>
</main>

<footer style="padding:18px 32px 22px;text-align:center;font-size:13px;line-height:1.5;color:#5D6570">
Responde con base en la LFT vigente (última reforma en el DOF: 14 de mayo de 2026). Información orientativa; no sustituye asesoría legal.
</footer>

</div>
</x-dc>
