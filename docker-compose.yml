services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lft_db
    environment:
      POSTGRES_USER: lft
      POSTGRES_PASSWORD: lft
      POSTGRES_DB: lft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lft"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
